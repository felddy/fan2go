name: Go

on:
  push:
    branches: [ master ]
    tags:
      - '*.*.*' # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [ master ]

jobs:
  generate:
    name: Generate cross-platform builds
    runs-on: ubuntu-latest

    steps:
      - name: Install libsensors-dev (needed for gosensors testing)
        run: sudo apt-get install -y libsensors-dev

      - name: Checkout the repository
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '^1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          version: latest

          # Optional: working directory, useful for monorepos
          # working-directory: somedir

          # Optional: golangci-lint command line arguments.
          # args: --exclude-use-default
          # --issues-exit-code=0

          # Optional: show only new issues if it's a pull request. The default value is `false`.
          # only-new-issues: true

          # Optional: if set to true then the all caching functionality will be complete disabled,
          #           takes precedence over all other caching options.
          # skip-cache: true

          # Optional: if set to true then the action don't cache or restore ~/go/pkg.
          skip-cache: false

          # Optional: if set to true then the action don't cache or restore ~/.cache/go-build.
          # skip-build-cache: true

      - name: Test
        run: make test

      - name: Generate build files (amd64)
        run: |
          GOOS="linux"
          GOARCH="amd64"
          GOFLAGS="-buildmode=exe"
          NAME="fan2go-${GOOS}-${GOARCH}"
          OUTPUT_BIN="dist/${NAME}"

          make build GOOS="${GOOS}" OARCH="${GOARCH}" GOFLAGS="${GOFLAGS}" OUTPUT_BIN="${OUTPUT_BIN}"
          ./dist/fan2go-linux-amd64 version

          # same for the version without nvml, to make sure it still compiles
          make build-no-nvml GOOS="${GOOS}" OARCH="${GOARCH}" GOFLAGS="${GOFLAGS}" OUTPUT_BIN="${OUTPUT_BIN}-no-nvml"
          ./dist/fan2go-linux-amd64-no-nvml version

      - name: Nvml Check
        run: |
          set -x
          # make sure the no-nvml build *really* doesn't use nvml
          # ("nvml" is printed by objdump at least once because of the filename,
          #  but if nvml is linked, it has hundreds of occurences)
          test `objdump -T ./dist/fan2go-linux-amd64-no-nvml | grep -c nvml` -lt 3
          # .. and that the regular build *does* have symbols with "nvml" in it
          test `objdump -T ./dist/fan2go-linux-amd64 | grep -c nvml` -ge 3

      - name: Set up ppc64le multiarch
        run: |
          sudo dpkg --add-architecture ppc64el
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-ppc64el libsensors-dev:ppc64el

      - name: Generate build files (ppc64le)
        run: |
          OUTPUT_BIN="dist/fan2go-linux-ppc64le"
          CGO_ENABLED=1 \
          CC=powerpc64le-linux-gnu-gcc \
          GOOS=linux \
          GOARCH=ppc64le \
          go build \
            -ldflags "-w -s \
              -X fan2go/cmd/global.Version=${VERSION} \
              -X github.com/markusressel/fan2go/cmd/global.Version=${VERSION} \
              -X fan2go/cmd/global.Commit=${GIT_REV} \
              -X github.com/markusressel/fan2go/cmd/global.Commit=${GIT_REV} \
              -X fan2go/cmd/global.Date=${DATE} \
              -X github.com/markusressel/fan2go/cmd/global.Date=${DATE}" \
            -a -tags netgo \
            -o "${OUTPUT_BIN}" main.go
          file "${OUTPUT_BIN}"

      - name: Set up s390x multiarch
        run: |
          sudo dpkg --add-architecture s390x
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-s390x libsensors-dev:s390x

      - name: Generate build files (s390x)
        run: |
          OUTPUT_BIN="dist/fan2go-linux-s390x"
          CGO_ENABLED=1 \
          CC=s390x-linux-gnu-gcc \
          GOOS=linux \
          GOARCH=s390x \
          go build \
            -ldflags "-w -s \
              -X fan2go/cmd/global.Version=${VERSION} \
              -X github.com/markusressel/fan2go/cmd/global.Version=${VERSION} \
              -X fan2go/cmd/global.Commit=${GIT_REV} \
              -X github.com/markusressel/fan2go/cmd/global.Commit=${GIT_REV} \
              -X fan2go/cmd/global.Date=${DATE} \
              -X github.com/markusressel/fan2go/cmd/global.Date=${DATE}" \
            -a -tags netgo \
            -o "${OUTPUT_BIN}" main.go
          file "${OUTPUT_BIN}"

  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install libsensors-dev (needed for gosensors)
        run: sudo apt-get install -y libsensors-dev

      - name: Checkout the repository
        uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '^1.23'

      - name: Generate build files (arm64)
        run: |
          GOOS="linux"
          GOARCH="arm64"
          GOFLAGS="-buildmode=exe"
          OUTPUT_BIN="dist/fan2go-linux-arm64"
          make build GOOS="${GOOS}" OARCH="${GOARCH}" GOFLAGS="${GOFLAGS}" OUTPUT_BIN="${OUTPUT_BIN}"
          file "${OUTPUT_BIN}"

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fan2go-linux-arm64
          path: dist/fan2go-linux-arm64

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [generate, build-arm64]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fan2go-linux-arm64
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fan2go-linux-amd64
            dist/fan2go-linux-amd64-no-nvml
            dist/fan2go-linux-arm64
            dist/fan2go-linux-ppc64le
            dist/fan2go-linux-s390x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
